{% extends "partials/header.html" %}

{% block tabs %}
  {{ super() }}
  <div class="md-header__option">
    <div class="custom-controls" style="display: flex; gap: 6px; align-items: center; margin-right: 1rem;">

      <!-- Кнопка зменшення -->
      <button class="md-header__button md-icon"
              onclick="changeSize(-2)"
              title="Зменшити шрифт (А-)"
              aria-label="Decrease font size"
              style="font-size: 1rem; font-weight: bold; padding: 2px 6px;">
        A<sup style="font-size:0.6em">−</sup>
      </button>

      <!-- Індикатор поточного розміру + скидання -->
      <span id="font-size-indicator"
            onclick="resetFontSize()"
            title="Натисніть для скидання"
            style="font-size: 0.7rem; cursor: pointer; opacity: 0.7; min-width: 36px; text-align: center;">
        16px
      </span>

      <!-- Кнопка збільшення -->
      <button class="md-header__button md-icon"
              onclick="changeSize(2)"
              title="Збільшити шрифт (А+)"
              aria-label="Increase font size"
              style="font-size: 1.2rem; font-weight: bold; padding: 2px 6px;">
        A<sup style="font-size:0.6em">+</sup>
      </button>

    </div>
  </div>

  <script>
    // Відновлюємо розмір та індикатор одразу при рендері хедера
    (function () {
      const saved = localStorage.getItem('sbsq-font-size');
      const size = saved ? parseInt(saved) : 16;
      document.documentElement.style.fontSize = size + 'px';
      // Встановлюємо індикатор після рендеру DOM
      document.addEventListener('DOMContentLoaded', function () {
        const ind = document.getElementById('font-size-indicator');
        if (ind) ind.textContent = size + 'px';
      });
    })();
  </script>
{% endblock %}
