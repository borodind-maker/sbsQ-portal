{% extends "partials/header.html" %}

{% block tabs %}
  {{ super() }}
  <div class="md-header__option">
    <div class="custom-controls" style="display: flex; gap: 10px; align-items: center; margin-right: 1rem;">
      <button class="md-header__button md-icon" onclick="changeSize(2)" title="Increase Font">
        <!-- Material Design 'Format Size' icon imitation -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4H9m-6 8h3v7h3v-7h3V9H3v3z" fill="currentColor"/></svg>
        <span style="font-size: 0.7em; vertical-align: super;">+</span>
      </button>
      <button class="md-header__button md-icon" onclick="changeSize(-2)" title="Decrease Font">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4H9m-6 8h3v7h3v-7h3V9H3v3z" fill="currentColor"/></svg>
        <span style="font-size: 0.7em; vertical-align: super;">-</span>
      </button>
    </div>
  </div>

  <script>
    // Inline fallback for size change if asset not loaded
    function changeSize(delta) {
      const html = document.documentElement;
      let currentSize = parseInt(window.getComputedStyle(html).fontSize);
      let newSize = Math.min(Math.max(currentSize + delta, 12), 24);
      html.style.fontSize = newSize + "px";
    }
  </script>
{% endblock %}
